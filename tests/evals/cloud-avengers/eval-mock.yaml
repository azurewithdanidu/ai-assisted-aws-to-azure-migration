# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/eval.schema.json
name: cloud-avengers-mock-eval
description: >
  Mock evaluation suite for the cloud-avengers plugin.
  Validates trigger accuracy and negative trigger suppression for the
  aws-inventory-scan skill using a mock executor (no LLM required).
  Used in every PR to validate eval schema and smoke/negative cases quickly.
skill: aws-inventory-scan
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 60
  parallel: false
  executor: mock
  model: claude-sonnet-4.6

metrics:
  - name: trigger_accuracy
    weight: 1.0
    threshold: 1.0
    description: Does the skill trigger correctly on migration prompts and stay silent on unrelated prompts?

tasks:
  - "tasks/smoke/*.yaml"
  - "tasks/negative/*.yaml"
