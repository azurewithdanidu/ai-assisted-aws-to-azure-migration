# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/eval.schema.json
name: cloud-avengers-github-actions-oidc-eval
description: Skill-level eval suite for github-actions-oidc.
skill: github-actions-oidc
version: "1.0"
config:
