agent_policy:
  coverage_goal: 1.0
  rule: >
    Every production agent should have at least one eval task tagged agent:<agent-name>.
    Until a dedicated agent grader is introduced, proxy coverage can be measured with
    agent-tagged trigger tasks that validate orchestration prompts.
