version: "1.0"
name: cloud-avengers-eval-scorecard
description: >
  Canonical scorecard that defines measurable outcomes, thresholds, and
  one-to-one task criteria mapping for the cloud-avengers eval suite.

measurement:
  cadence: per-pr-and-nightly
  repeat_runs_for_flakiness: 5
  dimensions:
    - pass_rate
    - critical_pass_rate
    - flakiness_rate
    - p95_latency_seconds
    - cost_per_run_usd

targets:
  pass_rate:
    baseline: 0.75
    target: 0.90
    gate: 0.85
  critical_pass_rate:
    baseline: 0.80
    target: 0.95
    gate: 0.90
  flakiness_rate:
    baseline: 0.10
    target: 0.02
    gate: 0.03
  p95_latency_seconds:
    baseline: 45
    target: 30
    gate: 35
  cost_per_run_usd:
    baseline: 2.00
    target: 1.20
    gate: 1.50

task_scorecard:
  - task_id: eval:smoke/should-trigger
    owner_type: skill
    owner_id: aws-inventory-scan
    criteria:
      metric: trigger_accuracy
      expected_outcome: should_trigger=true
      target: 1.0
      weight: 1.0
    status: active
  - task_id: eval:smoke/deploy-infra-triggers
    owner_type: agent
    owner_id: migration-project-manager
    criteria:
      metric: trigger_accuracy
      expected_outcome: should_trigger=true
      target: 1.0
      weight: 1.0
    status: active
  - task_id: eval:negative/should-not-trigger-unrelated
