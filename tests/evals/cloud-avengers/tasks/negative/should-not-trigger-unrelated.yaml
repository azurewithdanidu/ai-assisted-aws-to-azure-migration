# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:negative/should-not-trigger-unrelated
name: AWS inventory scan does not trigger on unrelated prompts
description: >
  Validates that aws-inventory-scan does NOT activate for prompts completely
  unrelated to AWS resource discovery or cloud migration.
tags:
  - negative
  - anti-trigger
  - skill-core
  - skill:aws-inventory-scan
inputs:
  prompt: "What is the capital of France?"
expected:
  should_trigger: false
graders:
  - type: trigger
    name: skill-does-not-activate
    config:
      skill_path: "skills/aws-inventory-scan"
      mode: "negative"
    weight: 1.0
