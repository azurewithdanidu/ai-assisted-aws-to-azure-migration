# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/v0.23.0/schemas/task.schema.json
id: eval:smoke/deploy-infra-triggers
name: AWS inventory scan triggers on run-migration entry point
description: >
  Validates that the /run-migration slash command activates the migration
  pipeline including the aws-inventory-scan skill.
tags:
  - smoke
  - trigger
inputs:
  prompt: "Run the full migration pipeline for AWS account 535002891143 targeting Azure subscription sub-001"
expected:
  should_trigger: true
graders:
  - type: trigger
    name: skill-activates-via-orchestrator
    config:
      skill_path: "skills/aws-inventory-scan"
      mode: "positive"
    weight: 1.0
