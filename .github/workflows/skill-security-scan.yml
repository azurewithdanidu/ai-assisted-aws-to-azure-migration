name: Skill Security Scan

on:
  pull_request:
    branches: [dev, main]

jobs:
  skill-security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check for skill changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            skills:
              - 'skills/**'

      - name: Checkout PR HEAD
        if: steps.filter.outputs.skills == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.12
        if: steps.filter.outputs.skills == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SkillSpector
        if: steps.filter.outputs.skills == 'true'
        run: |
          python -m pip install --quiet \
            "git+https://github.com/NVIDIA/skillspector@2eb844780ab163f01468ecf142c40a2ec0fcaec0"
          skillspector --version

      - name: Run scan (JSON + SARIF)
        if: steps.filter.outputs.skills == 'true'
        env:
          SKILL_PATH: skills
          JSON_OUTPUT: skillspector.json
          SARIF_OUTPUT: skillspector.sarif
        run: bash .github/scripts/security/run-skillspector-scan.sh

      - name: Check severity threshold
        if: steps.filter.outputs.skills == 'true'
        env:
          SKILLSPECTOR_FAIL_ON: "HIGH,CRITICAL"
        run: bash .github/scripts/security/check-skillspector-threshold.sh skillspector.json

      - name: Upload SARIF artifact
        if: steps.filter.outputs.skills == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-sarif
          path: skillspector.sarif
          retention-days: 30

      - name: Upload JSON report artifact
        if: steps.filter.outputs.skills == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-report
          path: skillspector.json
          retention-days: 30
